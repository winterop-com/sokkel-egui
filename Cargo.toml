[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
sokkel-ui-egui = { path = "crates/core" }
sokkel-ui-egui-charts = { path = "crates/charts" }
sokkel-ui-egui-maps = { path = "crates/maps" }
egui = "0.36.2"
lucide-icons = "0.575"
walkers = "0.60"
eframe = { version = "0.36.2", features = ["glow", "persistence"] }
egui_kittest = { version = "0.36.2", features = ["eframe", "snapshot", "wgpu"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
