[package]
name = "cut"
description = "Tidevann's cut: a video editor's data on a simulated backend, as sokkel-ui's cut example keeps it: projects, edits with undo and redo, playback, export settings and the clips' sound."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sokkel-egui.workspace = true
tidevann-shared = { path = "../shared" }
eframe.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
# The web's numbers read back to the bit, as `tests/web.rs` compares them.
serde_json = { workspace = true, features = ["float_roundtrip"] }
