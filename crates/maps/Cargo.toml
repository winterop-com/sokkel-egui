[package]
name = "sokkel-ui-egui-maps"
description = "sokkel-ui-egui's maps: walkers under the tokens, with markers and routes."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sokkel-ui-egui.workspace = true
egui.workspace = true
walkers.workspace = true
serde_json.workspace = true
# the same client walkers fetches its tiles with, blocking for the one lookup of OpenFreeMap's current build
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "system-proxy", "blocking"] }
