[package]
name = "cut"
description = "Tidevann's cut: sokkel-ui's video editor example in egui, one to one: projects, the bin, the preview, the inspector and the timeline, edits with undo and redo, on a simulated backend."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sokkel-egui.workspace = true
sokkel-egui-media.workspace = true
tidevann-shared = { path = "../shared" }
eframe.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
# The web's numbers read back to the bit, as `tests/web.rs` compares them.
serde_json = { workspace = true, features = ["float_roundtrip"] }
