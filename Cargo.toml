[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
sokkel-egui = { path = "crates/core" }
sokkel-egui-charts = { path = "crates/charts" }
sokkel-egui-maps = { path = "crates/maps" }
sokkel-egui-graph = { path = "crates/graph" }
egui = "0.37.0"
egui_extras = { version = "0.37.0", default-features = false, features = ["svg"] }
lucide-icons = "0.575"
walkers = { version = "0.65", features = ["mvt"] }
eframe = { version = "0.37.0", features = ["persistence"] }
egui_kittest = { version = "0.37.0", features = ["eframe", "snapshot", "wgpu"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
