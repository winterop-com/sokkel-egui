[package]
name = "podcast"
description = "Tidevann's podcasts: sokkel-ui's podcast example in egui, one to one: the shows and their episodes on a simulated backend, each episode's script and the voices that speak it, following, New, the queue, downloads, the sleep timer, the search and the time listened, with the player along the foot."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sokkel-egui.workspace = true
sokkel-egui-media.workspace = true
eframe.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
# The web's numbers read back to the bit, as `tests/web.rs` compares them.
serde_json = { workspace = true, features = ["float_roundtrip"] }
